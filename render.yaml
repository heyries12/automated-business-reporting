services:
  - type: web
    name: automated-business-reporting-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SERVICE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: REPORT_DATE_FIELD
        value: created_at
      - key: REPORT_AMOUNT_FIELD
        value: amount
      - key: REPORT_STATUS_FIELD
        value: status
      - key: REPORT_CUSTOMER_FIELD
        value: customer_id
      - key: REPORT_CATEGORY_FIELD
        value: category
      - key: REPORT_SUCCESS_STATUSES
        value: paid,completed,fulfilled
      - key: REPORT_CURRENCY
        value: USD
      - key: REPORT_MAX_RECORDS
        value: "10000"
